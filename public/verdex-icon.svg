<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" role="img" aria-label="Verdex" fill="none" stroke="#102512" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <title>Verdex</title>

  <!-- crossbar -->
  <line x1="14" y1="28" x2="86" y2="28"/>

  <!-- V post + brand letterform -->
  <path d="M23 28 L50 80 L77 28"/>

  <!-- hanger strings -->
  <line x1="23" y1="28" x2="23" y2="42"/>
  <line x1="77" y1="28" x2="77" y2="42"/>

  <!-- pan rims -->
  <line x1="9"  y1="42" x2="37" y2="42"/>
  <line x1="63" y1="42" x2="91" y2="42"/>

  <!-- pan cups -->
  <path d="M9 42 A14 8 0 0 1 37 42"/>
  <path d="M63 42 A14 8 0 0 1 91 42"/>

  <!-- internal needles -->
  <line x1="23" y1="42" x2="23" y2="48"/>
  <line x1="77" y1="42" x2="77" y2="48"/>

  <!-- anchor dots -->
  <circle cx="23" cy="28" r="2.5" fill="#102512" stroke="none"/>
  <circle cx="77" cy="28" r="2.5" fill="#102512" stroke="none"/>

  <!-- teal pivot accent (fulcrum) -->
